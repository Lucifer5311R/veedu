<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 340px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #fff;
    color: #1a1a1a;
  }
  .header {
    background: linear-gradient(135deg, #4CAF50, #2E7D32);
    color: white;
    padding: 16px;
    text-align: center;
  }
  .header h1 { font-size: 16px; font-weight: 700; }
  .header p { font-size: 11px; opacity: 0.85; margin-top: 2px; }
  .section { padding: 14px 16px; }
  .section + .section { border-top: 1px solid #eee; }
  label { display: block; font-size: 11px; font-weight: 600; color: #666; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  input[type="text"], input[type="url"] {
    width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px;
    font-size: 13px; outline: none; transition: border 0.2s;
  }
  input:focus { border-color: #4CAF50; }
  .btn {
    width: 100%; padding: 10px; border: none; border-radius: 10px;
    font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s;
    margin-top: 10px;
  }
  .btn-primary { background: linear-gradient(135deg, #4CAF50, #2E7D32); color: white; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-save { background: #f0f0f0; color: #333; font-size: 12px; padding: 8px; }
  .btn-save:hover { background: #e0e0e0; }
  .status {
    margin-top: 10px; padding: 8px 12px; border-radius: 8px;
    font-size: 12px; font-weight: 600; display: none;
  }
  .status.success { display: block; background: #F0FDF4; color: #2E7D32; }
  .status.error { display: block; background: #FFF5F5; color: #E53E3E; }
  .status.loading { display: block; background: #F7FAFC; color: #666; }
  .hint { font-size: 11px; color: #999; margin-top: 6px; }
  .saved-badge { font-size: 10px; color: #4CAF50; font-weight: 600; display: none; margin-left: 6px; }
</style>
</head>
<body>
  <div class="header">
    <h1>🛒 Veedu Importer</h1>
    <p>Import Meesho products instantly</p>
  </div>

  <!-- API Key config -->
  <div class="section">
    <label>API Key <span id="saved-badge" class="saved-badge">✓ Saved</span></label>
    <input type="text" id="apiKey" placeholder="Your VEEDU_IMPORT_KEY">
    <button class="btn btn-save" id="saveKey">Save Key</button>
    <p class="hint">Set the same key as <code>VEEDU_IMPORT_KEY</code> env var on Vercel.</p>
  </div>

  <!-- URL Import -->
  <div class="section">
    <label>Import by URL</label>
    <input type="url" id="meeshoUrl" placeholder="https://www.meesho.com/product/p/abc123">
    <button class="btn btn-primary" id="importBtn">🚀 Import Product</button>
    <div id="status" class="status"></div>
    <p class="hint">Paste any Meesho product URL. The extension opens it, reads the page, and imports automatically.</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
